[project]
name = "ot-toolkit"
version = "1.0.0"
description = "Offline industrial communications and OT engineering toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.3,<1",
  "PySide6>=6.8,<7",
  "SQLAlchemy>=2.0.40,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6"]
package = ["pyinstaller>=6.16"]

[project.scripts]
ot-toolkit = "ot_toolkit_frontend.app:main"
ot-toolkit-api = "ot_toolkit_backend.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/ot_toolkit_backend", "frontend/src/ot_toolkit_frontend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "frontend/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ot_toolkit_backend"]
omit = ["*/ui/*", "*/app.py"]
